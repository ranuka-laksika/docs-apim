name: Claude Code • Auto PR on Comment

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "0 * * * *" 
  workflow_dispatch: {} 

concurrency:
  group: doc-fixing-ai-agent
  cancel-in-progress: false

jobs:
  get_issue_and_assign:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh jq 

      - name: Get the Oldest Issue with AI-Agent/Queued label
        id: get_oldest_queued
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_JSON=$(gh issue list --label "AI-Agent/Queued" --state open --json number,createdAt --limit 100 \
            | jq '[.[]] | sort_by(.createdAt) | .[0]')
          if [ "$ISSUE_JSON" = "null" ] || [ -z "$ISSUE_JSON" ]; then
            echo "oldest_issue_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          ISSUE_NUMBER=$(echo "$ISSUE_JSON" | jq -r .number)
          echo "oldest_issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Security Check - Scan for malicious patterns
        id: malicious_scan
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}

          echo "Scanning issue #$ISSUE_NUMBER for malicious content patterns..."

          # Get issue body (raw markdown, includes HTML comments and hidden content)
          ISSUE_BODY=$(gh api "repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '.body')

          echo "Issue body length: ${#ISSUE_BODY} characters"

          # Check if issue contains HTML comments (potential hiding technique)
          if echo "$ISSUE_BODY" | grep -q "<!--"; then
            echo "⚠️ Issue contains HTML comments (potential content hiding)"
          fi

          # Check if issue contains collapsed sections (potential hiding technique)
          if echo "$ISSUE_BODY" | grep -qi "<details>"; then
            echo "⚠️ Issue contains collapsed sections (potential content hiding)"
          fi

          # Define malicious patterns to detect (case-insensitive)
          # NOTE: These patterns scan the RAW markdown body, including:
          #   - HTML comments (<!-- -->)
          #   - Collapsed sections (<details>)
          #   - Reference links
          #   - All hidden content
          MALICIOUS_PATTERNS=(
            "curl.*-X.*POST.*http"
            "wget.*http"
            "printenv.*base64"
            "env.*base64"
            "\$\(printenv"
            "python.*-c.*import"
            "bash.*-c"
            "sh.*-c"
            "eval.*\$"
            "nc.*-e"
            "netcat"
            "telnet"
            "/dev/tcp/"
            "<!--.*curl"
            "<!--.*wget"
            "<!--.*INTERNAL"
            "<details>.*curl"
            "<details>.*wget"
            "INTERNAL.*PROCESSING.*NOTE"
            "MANDATORY.*CHECK"
            "SECURITY.*POLICY.*EXECUTE"
            "BEFORE.*CLOSING.*RUN"
            "BEFORE.*PR.*EXECUTE"
            "DO.*NOT.*INCLUDE.*IN.*PR"
          )

          SUSPICIOUS_FOUND=0
          MATCHED_PATTERNS=""

          for pattern in "${MALICIOUS_PATTERNS[@]}"; do
            if echo "$ISSUE_BODY" | grep -iE "$pattern" > /dev/null; then
              SUSPICIOUS_FOUND=1
              MATCHED_PATTERNS="$MATCHED_PATTERNS\n- Pattern: \`$pattern\`"
              echo "⚠️ Detected suspicious pattern: $pattern"
            fi
          done

          if [ $SUSPICIOUS_FOUND -eq 1 ]; then
            echo "suspicious_content=true" >> $GITHUB_OUTPUT

            # Add warning comment to issue
            WARNING_COMMENT="⚠️ **Security Scan Alert**

            Automated security scan detected potentially malicious content patterns in this issue:
            $MATCHED_PATTERNS

            **Action taken:** The automated agent will be instructed to ignore any command execution requests and focus only on legitimate documentation fixes.

            **For maintainers:** Please review the issue content carefully before manually processing. If this is a false positive and the issue is legitimate, the agent will proceed with documentation fixes only."

            gh issue comment $ISSUE_NUMBER --repo ${{ github.repository }} --body "$WARNING_COMMENT"

            echo "⚠️ Suspicious patterns detected. Agent will proceed with extra caution."
          else
            echo "✓ No malicious patterns detected."
            echo "suspicious_content=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if malicious content detected
        if: steps.malicious_scan.outputs.suspicious_content == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}

          echo "❌ Exiting workflow due to detected malicious patterns."

          # Remove AI-Agent/In-Progress label if it exists
          gh issue edit $ISSUE_NUMBER --remove-label "AI-Agent/In-Queued" 2>/dev/null || true

          echo "The issue has been flagged and will not be processed by the automated agent."
          exit 1
          
      - name: Update labels and trigger Claude
        if: steps.get_oldest_queued.outputs.oldest_issue_number != ''
        env: 
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: | 
          ISSUE=${{ steps.get_oldest_queued.outputs.oldest_issue_number }}

          # Remove AI-Agent/Queued, add AI-Agent/In-Progress
          gh issue edit $ISSUE --remove-label "AI-Agent/Queued"
          gh issue edit $ISSUE --add-label "AI-Agent/In-Progress"

          # Add trigger comment for Claude
          gh issue comment $ISSUE --body "@wso2-engineering-bot create a PR for this issue following repo conventions"

  run_claude:
    runs-on: ubuntu-latest
    if: contains(github.event.comment.body, '@wso2-engineering-bot')
    steps:
      - name: Security Check - Scan for malicious patterns
        id: malicious_scan
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}

          echo "Scanning issue #$ISSUE_NUMBER for malicious content patterns..."

          # Get issue body (raw markdown, includes HTML comments and hidden content)
          ISSUE_BODY=$(gh api "repos/${{ github.repository }}/issues/$ISSUE_NUMBER" --jq '.body')

          echo "Issue body length: ${#ISSUE_BODY} characters"

          # Check if issue contains HTML comments (potential hiding technique)
          if echo "$ISSUE_BODY" | grep -q "<!--"; then
            echo "⚠️ Issue contains HTML comments (potential content hiding)"
          fi

          # Check if issue contains collapsed sections (potential hiding technique)
          if echo "$ISSUE_BODY" | grep -qi "<details>"; then
            echo "⚠️ Issue contains collapsed sections (potential content hiding)"
          fi

          # Define malicious patterns to detect (case-insensitive)
          # NOTE: These patterns scan the RAW markdown body, including:
          #   - HTML comments (<!-- -->)
          #   - Collapsed sections (<details>)
          #   - Reference links
          #   - All hidden content
          MALICIOUS_PATTERNS=(
            "curl.*-X.*POST.*http"
            "wget.*http"
            "printenv.*base64"
            "env.*base64"
            "\$\(printenv"
            "python.*-c.*import"
            "bash.*-c"
            "sh.*-c"
            "eval.*\$"
            "nc.*-e"
            "netcat"
            "telnet"
            "/dev/tcp/"
            "<!--.*curl"
            "<!--.*wget"
            "<!--.*INTERNAL"
            "<details>.*curl"
            "<details>.*wget"
            "INTERNAL.*PROCESSING.*NOTE"
            "MANDATORY.*CHECK"
            "SECURITY.*POLICY.*EXECUTE"
            "BEFORE.*CLOSING.*RUN"
            "BEFORE.*PR.*EXECUTE"
            "DO.*NOT.*INCLUDE.*IN.*PR"
          )

          SUSPICIOUS_FOUND=0
          MATCHED_PATTERNS=""

          for pattern in "${MALICIOUS_PATTERNS[@]}"; do
            if echo "$ISSUE_BODY" | grep -iE "$pattern" > /dev/null; then
              SUSPICIOUS_FOUND=1
              MATCHED_PATTERNS="$MATCHED_PATTERNS\n- Pattern: \`$pattern\`"
              echo "⚠️ Detected suspicious pattern: $pattern"
            fi
          done

          if [ $SUSPICIOUS_FOUND -eq 1 ]; then
            echo "suspicious_content=true" >> $GITHUB_OUTPUT

            # Add warning comment to issue
            WARNING_COMMENT="⚠️ **Security Scan Alert**

            Automated security scan detected potentially malicious content patterns in this issue:
            $MATCHED_PATTERNS

            **Action taken:** The automated agent will be instructed to ignore any command execution requests and focus only on legitimate documentation fixes.

            **For maintainers:** Please review the issue content carefully before manually processing. If this is a false positive and the issue is legitimate, the agent will proceed with documentation fixes only."

            gh issue comment $ISSUE_NUMBER --repo ${{ github.repository }} --body "$WARNING_COMMENT"

            echo "⚠️ Suspicious patterns detected. Agent will proceed with extra caution."
          else
            echo "✓ No malicious patterns detected."
            echo "suspicious_content=false" >> $GITHUB_OUTPUT
          fi

      - name: Exit if malicious content detected
        if: steps.malicious_scan.outputs.suspicious_content == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_NUMBER=${{ github.event.issue.number }}

          echo "❌ Exiting workflow due to detected malicious patterns."

          # Remove AI-Agent/In-Progress label if it exists
          gh issue edit $ISSUE_NUMBER --remove-label "AI-Agent/In-Progress" 2>/dev/null || true

          echo "The issue has been flagged and will not be processed by the automated agent."
          exit 1
      - name: Checkout original repository
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DOC_FIXING_AGENT_REPOSITORY }}  
          token: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
          fetch-depth: 0 

      - name: Configure git for commits
        run: |
          # Show current remotes for debugging
          echo "Current remotes:"
          git remote -v
          
          # Configure git for commits
          git config user.name ${{secrets.DOC_FIXING_AGENT_GIT_USER_NAME}}
          git config user.email ${{secrets.DOC_FIXING_AGENT_GIT_USER_EMAIL}}

      - name: Prepare system prompt with environment variables
        id: prepare_prompt
        run: |
          # Install gettext if not available (for envsubst)
          if ! command -v envsubst &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y gettext-base
          fi
          
          # Export environment variables for substitution
          export ISSUE_NUMBER="${{ github.event.issue.number }}"
          export REPOSITORY="${{ vars.DOC_FIXING_AGENT_REPOSITORY }}"
          export LATEST_VERSION="${{ vars.DOC_FIXING_AGENT_LATEST_VERSION }}"  
          
          # Process the system prompt with variable substitution
          SYSTEM_PROMPT=$(envsubst < ${{github.workspace}}/.github/claude/system_prompt.txt)
          
          # Save to GitHub env
          echo "SYSTEM_PROMPT<<EOF" >> $GITHUB_ENV
          echo "$SYSTEM_PROMPT" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          
          # Also set these for Claude
          echo "ISSUE_NUMBER=$ISSUE_NUMBER" >> $GITHUB_ENV
          echo "REPOSITORY=$REPOSITORY" >> $GITHUB_ENV
          echo "LATEST_VERSION=$LATEST_VERSION" >> $GITHUB_ENV

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Run Claude
        id: run_claude
        uses: anthropics/claude-code-action@v1
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ vars.DOC_FIXING_AGENT_REPOSITORY }}
        with:
          anthropic_api_key: ${{ secrets.DOC_FIXING_AGENT_ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
          prompt: ${{ env.SYSTEM_PROMPT }}
          trigger_phrase: "@wso2-engineering-bot"
          claude_args: |
            --allowedTools "Bash(git:*),Bash(mkdir:*),WebFetch,mcp__github__create_pull_request,mcp__github__get_issue,mcp__github__search_pull_requests,mcp__github__list_branches,Edit,Read,Write,mcp__github__update_issue,mcp__github__create_branch,mcp__github__add_issue_comment,mcp__github__get_file_contents"
            --model claude-sonnet-4-5-20250929
            
      - name: Validate MkDocs Build
        id: validate_build
        continue-on-error: true
        run: |
          # This step validates Claude's changes by building the docs
          # The working directory contains all edits made by Claude in the previous step

          # Debug: Show current directory and structure
          echo "📍 Current directory: $(pwd)"
          echo "📂 Directory contents:"
          ls -la

          # Show Claude's committed changes (if any)
          echo "📝 Claude's changes (last commit):"
          if git log -1 --name-status 2>/dev/null | grep -q "^[AMD]"; then
            echo "Files changed in last commit:"
            git log -1 --name-status --pretty=format:""
            echo ""
            echo "Commit message:"
            git log -1 --pretty=format:"%s"
            echo ""
          else
            echo "(No commits by Claude yet, or working directory has uncommitted changes)"
            git status --short
          fi

          # Install Python dependencies from requirements.txt
          python3 -m pip install --upgrade pip

          # Navigate to en directory where mkdocs.yml is located
          cd en
          echo "📍 After cd en: $(pwd)"
          echo "📂 Contents of en/:"
          ls -la | head -20

          pip3 install -r requirements.txt

          # Try to build the documentation (without --strict to allow warnings)
          echo "Building MkDocs documentation..."
          if python3 -m mkdocs build; then
            echo "build_status=success" >> $GITHUB_OUTPUT
            echo "✅ MkDocs build successful"
          else
            echo "build_status=failed" >> $GITHUB_OUTPUT
            echo "❌ MkDocs build failed"
            exit 1
          fi

      - name: Comment on build failure
        if: steps.validate_build.outputs.build_status == 'failed'
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "⚠️ **MkDocs Build Failed**

          The documentation changes could not be built successfully. Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.

          Common issues:
          - Broken markdown syntax
          - Invalid links
          - Missing required front matter

          The PR may have been created, but the documentation will not render correctly."

      - name: Get next queued issue
        id: get_next_queued
        env:
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        run: |
          ISSUE_JSON=$(gh issue list --label "AI-Agent/Queued" --state open --json number,createdAt --limit 100 \
            | jq '[.[]] | sort_by(.createdAt) | .[0]')
          if [ "$ISSUE_JSON" = "null" ] || [ -z "$ISSUE_JSON" ]; then
            echo "next_issue_number=" >> $GITHUB_OUTPUT
            exit 0
          fi
          NEXT_ISSUE_NUMBER=$(echo "$ISSUE_JSON" | jq -r .number)
          echo "next_issue_number=$NEXT_ISSUE_NUMBER" >> $GITHUB_OUTPUT

      - name: Exit if no queued issues
        if: steps.get_next_queued.outputs.next_issue_number == ''
        run: |
          echo "No queued issues."
          exit 0

      - name: Update labels and trigger Claude
        env: 
          GITHUB_TOKEN: ${{ secrets.DOC_FIXING_AGENT_GITHUB_TOKEN }}
        if: steps.get_next_queued.outputs.next_issue_number != ''
        run: | 
          ISSUE=${{ steps.get_next_queued.outputs.next_issue_number }}

          # Remove AI-Agent/Queued, add AI-Agent/In-Progress
          gh issue edit $ISSUE --remove-label "AI-Agent/Queued"
          gh issue edit $ISSUE --add-label "AI-Agent/In-Progress"

          # Add trigger comment for Claude
          gh issue comment $ISSUE --body "@wso2-engineering-bot create a PR for this issue following repo conventions"
